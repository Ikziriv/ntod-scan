[package]
name = "ntod-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
ai = ["dep:ntod-ai"]
tools = ["dep:ntod-tools"]

[dependencies]
axum = { workspace = true, features = ["multipart", "ws"] }
include_dir = "0.7.4"
ipnetwork.workspace = true
maud = { version = "0.27.0", features = ["axum"] }
ntod-ai = { path = "../ai", optional = true }
ntod-analysis = { path = "../analysis" }
ntod-capture = { path = "../capture" }
ntod-core = { path = "../core" }
ntod-tools = { path = "../tools", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower.workspace = true
